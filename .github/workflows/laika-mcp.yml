name: L.A.I.K.A. local tools checks

on:
  push:
    paths:
      - "laika/**"
      - ".github/workflows/laika-mcp.yml"
  pull_request:
    paths:
      - "laika/**"
      - ".github/workflows/laika-mcp.yml"

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check installer syntax
        run: bash -n laika/install-user.sh
      - name: Run safety tests
        run: python -m unittest discover -s laika -p "test_*.py" -v
